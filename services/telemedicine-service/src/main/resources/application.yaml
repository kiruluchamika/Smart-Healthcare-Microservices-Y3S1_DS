spring:
  application:
    name: telemedicine-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3314/telemedicine_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:telemedicine_user}
    password: ${SPRING_DATASOURCE_PASSWORD:telemedicine_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: services/telemedicine-service/docker-compose.yaml
      lifecycle-management: start-and-stop
      stop:
        command: down

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
