spring:
  application:
    name: notification-service
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: ${SPRING_DOCKER_COMPOSE_FILE:services/notification-service/docker-compose.yaml}
      lifecycle-management: start-and-stop
      stop:
        command: down
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3315/notification_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:notification_user}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8084

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

app:
  notification:
    from-email: ${APP_NOTIFICATION_FROM_EMAIL:no-reply@smarthealthcare.local}
    reply-to-email: ${APP_NOTIFICATION_REPLY_TO_EMAIL:no-reply@smarthealthcare.local}
    subject-prefix: ${APP_NOTIFICATION_SUBJECT_PREFIX:Smart Healthcare}
  integrations:
    auth-base-url: http://localhost:8080/auth
    doctor-base-url: http://localhost:8083/api/v1/doctors
    patient-base-url: http://localhost:8085/patients
    doctor-username: doctor
    doctor-password: doctor123

management:
  endpoints:
    web:
      exposure:
        include: health,info
