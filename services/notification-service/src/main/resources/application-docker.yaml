spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-notification:3306/notification_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:notification_user}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

app:
  notification:
    from-email: ${APP_NOTIFICATION_FROM_EMAIL:no-reply@smarthealthcare.local}
    reply-to-email: ${APP_NOTIFICATION_REPLY_TO_EMAIL:no-reply@smarthealthcare.local}
    subject-prefix: ${APP_NOTIFICATION_SUBJECT_PREFIX:Smart Healthcare}
  integrations:
    auth-base-url: http://auth-service:8080/auth
    doctor-base-url: http://doctor-service:8083/api/v1/doctors
    patient-base-url: http://patient-service:8085/patients
    doctor-username: doctor
    doctor-password: doctor123
