services:
  mysql-notification:
    image: mysql:8.0
    container_name: mysql-notification-local
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: notification_service_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_pass
    ports:
      - "3315:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-notification-data:
