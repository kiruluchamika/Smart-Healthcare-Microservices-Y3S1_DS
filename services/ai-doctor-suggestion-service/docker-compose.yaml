services:
  mysql-ai-doctor-suggestion:
    image: mysql:8.0
    container_name: mysql-ai-doctor-suggestion
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_doctor_suggestion_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-ai-doctor-suggestion-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-ai-doctor-suggestion-data:
