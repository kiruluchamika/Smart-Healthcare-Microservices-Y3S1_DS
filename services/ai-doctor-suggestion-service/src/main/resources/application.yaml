spring:
  application:
    name: ai-doctor-suggestion-service
  config:
    import: optional:application-local.yaml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/ai_doctor_suggestion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  docker:
    compose:
      enabled: true
      file: services/ai-doctor-suggestion-service/docker-compose.yaml
      lifecycle-management: start-and-stop
      stop:
        command: down

server:
  port: ${SERVER_PORT:8092}

doctor:
  service:
    base-url: ${DOCTOR_SERVICE_BASE_URL:http://localhost:8083}
    username: ${DOCTOR_SERVICE_USERNAME:doctor}
    password: ${DOCTOR_SERVICE_PASSWORD:doctor123}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  startup:
    enabled: ${OLLAMA_STARTUP_ENABLED:true}
    auto-start-cli: ${OLLAMA_STARTUP_AUTO_START_CLI:true}
    auto-pull-model: ${OLLAMA_STARTUP_AUTO_PULL_MODEL:true}
    fail-fast-if-unavailable: ${OLLAMA_STARTUP_FAIL_FAST:true}
    readiness-attempts: ${OLLAMA_STARTUP_READINESS_ATTEMPTS:20}
    readiness-interval-ms: ${OLLAMA_STARTUP_READINESS_INTERVAL_MS:1500}
    fallback-ports: ${OLLAMA_STARTUP_FALLBACK_PORTS:12000,12001,12002}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
