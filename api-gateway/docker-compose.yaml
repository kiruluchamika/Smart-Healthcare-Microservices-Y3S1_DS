services:
  mysql-ai-suggestion:
    image: mysql:8.0
    container_name: mysql-ai-suggestion-local
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_doctor_suggestion_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-ai-suggestion-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-doctor-suggestion-service:
    build:
      context: ../services/ai-doctor-suggestion-service
      dockerfile: Dockerfile
    container_name: ai-doctor-suggestion-service-local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ai-suggestion:3306/ai_doctor_suggestion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      DOCTOR_SERVICE_BASE_URL: http://host.docker.internal:8083
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      mysql-ai-suggestion:
        condition: service_healthy
    ports:
      - "8092:8092"

volumes:
  mysql-ai-suggestion-local-data: