apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-telemedicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-telemedicine
  template:
    metadata:
      labels:
        app: mysql-telemedicine
    spec:
      containers:
        - name: mysql-telemedicine
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: telemedicine_service_db
            - name: MYSQL_USER
              value: telemedicine_user
            - name: MYSQL_PASSWORD
              value: telemedicine_pass
          volumeMounts:
            - name: mysql-telemedicine-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-telemedicine-storage
          persistentVolumeClaim:
            claimName: mysql-telemedicine-pvc
