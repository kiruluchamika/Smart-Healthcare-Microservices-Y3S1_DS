apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-doctor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-doctor
  template:
    metadata:
      labels:
        app: mysql-doctor
    spec:
      containers:
        - name: mysql-doctor
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: doctor_service_db
            - name: MYSQL_USER
              value: doctor_user
            - name: MYSQL_PASSWORD
              value: doctor_pass
          volumeMounts:
            - name: mysql-doctor-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-doctor-storage
          persistentVolumeClaim:
            claimName: mysql-doctor-pvc
