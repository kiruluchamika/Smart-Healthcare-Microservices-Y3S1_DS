apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-healthcare
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smart-healthcare-microservices-y3s1_ds-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: SERVER_PORT
              value: "8088"
            - name: APPOINTMENT_SERVICE_URL
              value: http://appointment-service:8082
            - name: DOCTOR_SERVICE_URL
              value: http://doctor-service:8083
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8086
            - name: TELEMEDICINE_SERVICE_URL
              value: http://telemedicine-service:8087
            - name: AI_DOCTOR_SUGGESTION_SERVICE_URL
              value: http://ai-doctor-suggestion-service:8092
            - name: AI_SYMPTOM_SERVICE_URL
              value: http://ai-symptom-service:8093
            - name: APP_SECURITY_ALLOWED_ORIGINS
              value: http://localhost:*,http://127.0.0.1:*
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-healthcare
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      nodePort: 30088

