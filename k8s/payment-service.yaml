apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: smart-healthcare
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: smart-healthcare-microservices-y3s1_ds-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-payment:3306/payment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_PAYMENT_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_PAYMENT_PASSWORD
            - name: SERVER_PORT
              value: "8086"
            - name: APP_SECURITY_ALLOWED_ORIGINS
              value: http://localhost:*,http://127.0.0.1:*
            - name: APPOINTMENT_SERVICE_BASE_URL
              value: http://appointment-service:8082
            - name: DOCTOR_SERVICE_BASE_URL
              value: http://doctor-service:8083/api/v1/doctors
            - name: DOCTOR_SERVICE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: DOCTOR_SERVICE_USERNAME
            - name: DOCTOR_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: DOCTOR_SERVICE_PASSWORD
            - name: TELEMEDICINE_SERVICE_BASE_URL
              value: http://telemedicine-service:8087
            - name: NOTIFICATION_SERVICE_BASE_URL
              value: http://notification-service:8084
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: APP_JWT_SECRET
            - name: PAYMENT_CHECKOUT_SUCCESS_URL
              value: http://localhost:5173/payments/success?session_id={CHECKOUT_SESSION_ID}
            - name: PAYMENT_CHECKOUT_CANCEL_URL
              value: http://localhost:5173/payments/cancel
          readinessProbe:
            tcpSocket:
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086

