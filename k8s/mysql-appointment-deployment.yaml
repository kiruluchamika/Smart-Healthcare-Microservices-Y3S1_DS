apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-appointment
  template:
    metadata:
      labels:
        app: mysql-appointment
    spec:
      containers:
        - name: mysql-appointment
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: appointment_service_db
          volumeMounts:
            - name: mysql-appointment-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-appointment-storage
          persistentVolumeClaim:
            claimName: mysql-appointment-pvc
