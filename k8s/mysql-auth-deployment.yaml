apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-auth
  template:
    metadata:
      labels:
        app: mysql-auth
    spec:
      containers:
        - name: mysql-auth
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
            - name: MYSQL_DATABASE
              value: auth_service_db
            - name: MYSQL_USER
              value: auth_user
            - name: MYSQL_PASSWORD
              value: auth_pass
          volumeMounts:
            - name: mysql-auth-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-auth-storage
          persistentVolumeClaim:
            claimName: mysql-auth-pvc
