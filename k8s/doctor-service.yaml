apiVersion: v1
kind: PersistentVolume
metadata:
  name: doctor-uploads-pv
spec:
  storageClassName: ""
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/smart-healthcare/doctor-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doctor-uploads-pvc
  namespace: smart-healthcare
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: doctor-uploads-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: smart-healthcare
  labels:
    app: doctor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: smart-healthcare-microservices-y3s1_ds-doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-doctor:3306/doctor_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_DOCTOR_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_DOCTOR_PASSWORD
            - name: SERVER_PORT
              value: "8083"
            - name: APP_UPLOAD_DIR
              value: /app/uploads
            - name: APP_SECURITY_ALLOWED_ORIGINS
              value: http://localhost:*,http://127.0.0.1:*
            - name: APP_SERVICES_APPOINTMENT_BASE_URL
              value: http://appointment-service:8082/appointments
          volumeMounts:
            - name: doctor-uploads
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: doctor-uploads
          persistentVolumeClaim:
            claimName: doctor-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: doctor-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
