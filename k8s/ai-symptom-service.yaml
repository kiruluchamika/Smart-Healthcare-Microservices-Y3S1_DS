apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service
  namespace: smart-healthcare
  labels:
    app: ai-symptom-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-service
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      containers:
        - name: ai-symptom-service
          image: smart-healthcare-microservices-y3s1_ds-ai-symptom-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8093
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-ai-symptom:3306/ai_symptom_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: GEMINI_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              value: gemini-1.5-pro
            - name: SERVER_PORT
              value: "8093"
          readinessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
  namespace: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: ai-symptom-service
  ports:
    - name: http
      port: 8093
      targetPort: 8093

