apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smart-healthcare
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: smart-healthcare-microservices-y3s1_ds-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-notification:3306/notification_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_NOTIFICATION_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: MYSQL_NOTIFICATION_PASSWORD
            - name: SERVER_PORT
              value: "8084"
            - name: APP_INTEGRATIONS_AUTH_BASE_URL
              value: http://auth-service:8080/auth
            - name: APP_INTEGRATIONS_DOCTOR_BASE_URL
              value: http://doctor-service:8083/api/v1/doctors
            - name: APP_INTEGRATIONS_PATIENT_BASE_URL
              value: http://patient-service:8085/patients
            - name: APP_INTEGRATIONS_DOCTOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: DOCTOR_SERVICE_USERNAME
            - name: APP_INTEGRATIONS_DOCTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-healthcare-secrets
                  key: DOCTOR_SERVICE_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
