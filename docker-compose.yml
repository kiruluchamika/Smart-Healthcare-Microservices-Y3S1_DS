services:
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-doctor:
    image: mysql:8.0
    container_name: mysql-doctor
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: doctor_service_db
      MYSQL_USER: doctor_user
      MYSQL_PASSWORD: doctor_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql-doctor-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-appointment:
    image: mysql:8.0
    container_name: mysql-appointment
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: appointment_service_db
    ports:
      - "3311:3306"
    volumes:
      - mysql-appointment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: patient_service_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-patient-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-ai-suggestion:
    image: mysql:8.0
    container_name: mysql-ai-suggestion
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_doctor_suggestion_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-ai-suggestion-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-ai-symptom:
    image: mysql:8.0
    container_name: mysql-ai-symptom
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_symptom_service_db
    ports:
      - "3313:3306"
    volumes:
      - mysql-ai-symptom-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: payment_service_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
    ports:
      - "3312:3306"
    volumes:
      - mysql-payment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-notification:
    image: mysql:8.0
    container_name: mysql-notification
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: notification_service_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_pass
    ports:
      - "3315:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-telemedicine:
    image: mysql:8.0
    container_name: mysql-telemedicine
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: telemedicine_service_db
      MYSQL_USER: telemedicine_user
      MYSQL_PASSWORD: telemedicine_pass
    ports:
      - "3314:3306"
    volumes:
      - mysql-telemedicine-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: ollama-model-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      SERVER_PORT: 8080
    depends_on:
      mysql-auth:
        condition: service_healthy
    ports:
      - "8080:8080"

  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-doctor:3306/doctor_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: doctor_user
      SPRING_DATASOURCE_PASSWORD: doctor_pass
      SERVER_PORT: 8083
      APP_UPLOAD_DIR: /app/uploads
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      APP_SERVICES_APPOINTMENT_BASE_URL: http://appointment-service:8082/appointments
    depends_on:
      mysql-doctor:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - doctor-uploads:/app/uploads

  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-appointment:3306/appointment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8082
      APP_SERVICES_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_DOCTOR_BASE_URL: http://doctor-service:8083/api/v1/doctors
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8084
      NOTIFICATION_ENABLED: "true"
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      mysql-appointment:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"

  patient-service:
    build:
      context: ./services/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-patient:3306/patient_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8085
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8082
      AUTH_SERVICE_BASE_URL: http://auth-service:8080/auth
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      mysql-patient:
        condition: service_healthy
      appointment-service:
        condition: service_started
    ports:
      - "8085:8085"
    volumes:
      - patient-uploads:/app/uploads

  ai-doctor-suggestion-service:
    build:
      context: ./services/ai-doctor-suggestion-service
      dockerfile: Dockerfile
    container_name: ai-doctor-suggestion-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ai-suggestion:3306/ai_doctor_suggestion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 8092
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_STARTUP_ENABLED: "false"
      OLLAMA_STARTUP_AUTO_START_CLI: "false"
      OLLAMA_STARTUP_AUTO_PULL_MODEL: "false"
      OLLAMA_STARTUP_FAIL_FAST: "false"
    depends_on:
      mysql-ai-suggestion:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "8092:8092"

  ai-symptom-service:
    build:
      context: ./services/ai-symptom-service
      dockerfile: Dockerfile
    container_name: ai-symptom-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ai-symptom:3306/ai_symptom_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-pro}
      SERVER_PORT: 8093
    depends_on:
      mysql-ai-symptom:
        condition: service_healthy
    ports:
      - "8093:8093"

  telemedicine-service:
    build:
      context: ./services/telemedicine-service
      dockerfile: Dockerfile
    container_name: telemedicine-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-telemedicine:3306/telemedicine_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: telemedicine_user
      SPRING_DATASOURCE_PASSWORD: telemedicine_pass
      SERVER_PORT: 8087
    depends_on:
      mysql-telemedicine:
        condition: service_healthy
    ports:
      - "8087:8087"

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notification:3306/notification_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_pass
      SERVER_PORT: 8084
    depends_on:
      mysql-notification:
        condition: service_healthy
    ports:
      - "8084:8084"

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-payment:3306/payment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      SERVER_PORT: 8086
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8082
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083/api/v1/doctors
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      TELEMEDICINE_SERVICE_BASE_URL: http://telemedicine-service:8087
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8084
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      PAYMENT_CHECKOUT_SUCCESS_URL: http://localhost:5173/payments/success?session_id={CHECKOUT_SESSION_ID}
      PAYMENT_CHECKOUT_CANCEL_URL: http://localhost:5173/payments/cancel
    depends_on:
      mysql-payment:
        condition: service_healthy
      appointment-service:
        condition: service_started
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
      DOCTOR_SERVICE_URL: http://doctor-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8086
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:8087
      AI_DOCTOR_SUGGESTION_SERVICE_URL: http://ai-doctor-suggestion-service:8092
      AI_SYMPTOM_SERVICE_URL: http://ai-symptom-service:8093
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      - doctor-service
      - appointment-service
      - telemedicine-service
      - ai-symptom-service
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - telemedicine-service
      - ai-symptom-service
      - api-gateway
    ports:
      - "5173:80"

      

volumes:
  mysql-auth-data:
  mysql-doctor-data:
  mysql-appointment-data:
  mysql-patient-data:
  mysql-ai-suggestion-data:
  mysql-ai-symptom-data:
  mysql-payment-data:
  mysql-notification-data:
  mysql-telemedicine-data:
  ollama-data:
  doctor-uploads:
  patient-uploads:

