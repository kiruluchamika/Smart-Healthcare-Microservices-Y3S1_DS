services:
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-doctor:
    image: mysql:8.0
    container_name: mysql-doctor
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: doctor_service_db
      MYSQL_USER: doctor_user
      MYSQL_PASSWORD: doctor_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql-doctor-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      APP_JWT_SECRET: auth-service-dev-secret-change-this-in-production-must-be-at-least-256-bits-long
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      SERVER_PORT: 8080
    depends_on:
      mysql-auth:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - auth-service
    ports:
      - "5173:80"

  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: patient_service_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-patient-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  patient-service:
    build:
      context: ./services/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-patient:3306/patient_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      APP_JWT_SECRET: your-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-HS256-algorithm-security
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      mysql-patient:
        condition: service_healthy
    ports:
      - "8085:8085"
    volumes:
      - patient-uploads:/app/uploads

  mysql-ai-suggestion:
    image: mysql:8.0
    container_name: mysql-ai-suggestion
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_doctor_suggestion_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-ai-suggestion-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-doctor-suggestion-service:
    build:
      context: ./services/ai-doctor-suggestion-service
      dockerfile: Dockerfile
    container_name: ai-doctor-suggestion-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ai-suggestion:3306/ai_doctor_suggestion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      DOCTOR_SERVICE_BASE_URL: http://host.docker.internal:8083
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      mysql-ai-suggestion:
        condition: service_healthy
    ports:
      - "8092:8092"

volumes:
  mysql-auth-data:
  mysql-doctor-data:
  mysql-patient-data:
  patient-uploads:
  mysql-ai-suggestion-data: