services:
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-doctor:
    image: mysql:8.0
    container_name: mysql-doctor
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: doctor_service_db
      MYSQL_USER: doctor_user
      MYSQL_PASSWORD: doctor_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql-doctor-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-appointment:
    image: mysql:8.0
    container_name: mysql-appointment
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: appointment_service_db
    ports:
      - "3311:3306"
    volumes:
      - mysql-appointment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: patient_service_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-patient-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: payment_service_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
    ports:
      - "3312:3306"
    volumes:
      - mysql-payment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      SERVER_PORT: 8080
    depends_on:
      mysql-auth:
        condition: service_healthy
    ports:
      - "8080:8080"

  doctor-service:
    build:
      context: ./services/doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-doctor:3306/doctor_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: doctor_user
      SPRING_DATASOURCE_PASSWORD: doctor_pass
      SERVER_PORT: 8083
      APP_UPLOAD_DIR: /app/uploads
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      mysql-doctor:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - doctor-uploads:/app/uploads

  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-appointment:3306/appointment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8082
      APP_SERVICES_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_DOCTOR_BASE_URL: http://doctor-service:8083/api/v1/doctors
      NOTIFICATION_ENABLED: "false"
    depends_on:
      mysql-appointment:
        condition: service_healthy
    ports:
      - "8082:8082"

  patient-service:
    build:
      context: ./services/patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-patient:3306/patient_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 8085
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8082
      AUTH_SERVICE_BASE_URL: http://auth-service:8080/auth
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      mysql-patient:
        condition: service_healthy
    ports:
      - "8085:8085"
    volumes:
      - patient-uploads:/app/uploads

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-payment:3306/payment_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      SERVER_PORT: 8086
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8082
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083/api/v1/doctors
      DOCTOR_SERVICE_USERNAME: doctor
      DOCTOR_SERVICE_PASSWORD: doctor123
      APP_JWT_SECRET: smart-healthcare-shared-jwt-secret-change-this-in-production-must-be-at-least-32-bytes
      PAYMENT_CHECKOUT_SUCCESS_URL: http://localhost:5173/payments/success?session_id={CHECKOUT_SESSION_ID}
      PAYMENT_CHECKOUT_CANCEL_URL: http://localhost:5173/payments/cancel
    depends_on:
      mysql-payment:
        condition: service_healthy
      appointment-service:
        condition: service_started
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      DOCTOR_SERVICE_URL: http://doctor-service:8083
      APP_SECURITY_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    depends_on:
      - doctor-service
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - api-gateway
    ports:
      - "5173:80"

volumes:
  mysql-auth-data:
  mysql-doctor-data:
  mysql-appointment-data:
  mysql-patient-data:
  mysql-payment-data:
  doctor-uploads:
  patient-uploads:
